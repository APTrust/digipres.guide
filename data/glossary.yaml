sources:
  dpc:
    name: "Digital Preservation Coalition, Digital Preservation Handbook glossary"
    short: "DPC"
    url: "https://www.dpconline.org/handbook/glossary"
  saa:
    name: "Society of American Archivists, Dictionary of Archives Terminology"
    short: "SAA"
    url: "https://dictionary.archivists.org/"
  fadgi:
    name: "Federal Agencies Digital Guidelines Initiative glossary"
    short: "FADGI"
