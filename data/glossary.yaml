terms:
  - id: "access"
    term: "Access"
    definitions:
      - source: "dpc"
        text: "As defined in the Handbook, access is assumed to mean continued, ongoing usability of a digital resource, retaining all qualities of authenticity, accuracy and functionality deemed to be essential for the purposes the digital material was created and/or acquired for."
      - source: "saa"
        text: "1.  The ability to get to archival resources through intellectual, digital, or physical means.\n\n2.  The consultation of archival resources within institutional or legal parameters."
        url: "https://dictionary.archivists.org/entry/access.html"
  - id: "appraisal"
    term: "Appraisal"
    definitions:
      - source: "saa"
        text: "1.  The process of identifying materials offered to an archives that have sufficient value to be accessioned.\n\n2.  The process of determining the length of time records should be retained, based on legal requirements and on their current and potential usefulness.\n\n3.  The process of determining the market value of an item; monetary appraisal.\n\nIn an archival context, appraisal is the process of determining whether records and other materials have permanent (archival) value. Appraisal may be done at the collection, creator, series, file, or item level. Appraisal can take place prior to donation and prior to physical transfer, at or after accessioning. The basis of appraisal decisions may include a number of factors, including the records’ provenance and content, their authenticity and reliability, their order and completeness, their condition and costs to preserve them, and their intrinsic value. Appraisal often takes place within a larger institutional collecting policy and mission statement.\n\nAppraisal is distinguished from monetary appraisal, which estimates fair market value. Appraisal is distinguished from evaluation, which is typically used by records managers to indicate a preliminary assessment of value based on existing retention schedules."
        url: "https://dictionary.archivists.org/entry/appraisal.html"
  - id: "bit-rot"
    term: "Bit Rot"
    definitions:
      - source: "saa"
        text: "The corruption of the lowest level of digital data."
        url: "https://dictionary.archivists.org/entry/bit-rot.html"
  - id: "born-digital"
    term: "Born Digital"
    definitions:
      - source: "dpc"
        text: "Digital materials which are not intended to have an analogue equivalent, either as the originating source or as a result of conversion to analogue form. This term has been used in the Handbook to differentiate them from 1) digital materials which have been created as a result of converting analogue originals; and 2) digital materials, which may have originated from a digital source but have been printed to paper, e.g. some electronic records."
      - source: "saa"
        text: "Originating in a computer environment."
        url: "https://dictionary.archivists.org/entry/born-digital.html"
      - source: "fadgi"
        text: "Digital content that originated as a digital product. Born digital content is distinct from digital content, which is created through the digitization of analog content. Examples of born digital content include word processing documents, spreadsheets, and original images produced with digital cameras."
  - id: "checksum"
    term: "Checksum"
    definitions:
      - source: "dpc"
        text: "A unique numerical signature derived from a file. Used to compare copies."
      - source: "saa"
        text: "A unique alphanumeric value that represents the bitstream of an individual computer file or set of files\n\nThe term checksum is often used interchangeably with other types of fixity tools such as cryptographic hash values generated by algorithms such as MD5, SHA-1, and SHA-256. Checksums or hashes are used in the context of digital preservation, such as during the process of transferring or storing files, in order to determine whether files have been altered. For example, an archivist can compare checksums or hashes generated before and after file transfer to determine whether the file has maintained the same value through the transfer process."
        url: "https://dictionary.archivists.org/entry/checksum.html"
      - source: "fadgi"
        text: "A hash algorithm is a function that converts a data string into a numeric string output of fixed length. The output string is generally much smaller than the original data. Hash algorithms are designed to be collision-resistant, meaning that there is a very low probability that the same string would be created for different data. Two of the most common hash algorithms are the MD5 (Message-Digest algorithm 5) and the SHA-1 (Secure Hash Algorithm). MD5 Message Digest checksums are commonly used to validate data integrity when digital files are transferred or stored."
  - id: "cultural-heritage"
    term: "Cultural Heritage"
    definitions:
      - source: "saa"
        text: "the tangible and intangible representations of humans and their lives that bring awareness and understanding of their shared identities\n\nCultural heritage can include art, artifacts, books, documents, manuscripts, objects, and records in various formats, as well as sites, structures, districts, traditional performances, ritual celebrations, storytelling, language, information, and traditions."
        url: "https://dictionary.archivists.org/entry/cultural-heritage.html"
  - id: "digital-archiving"
    term: "Digital Archiving"
    definitions:
      - source: "dpc"
        text: "This term is used very differently within sectors. The library and archiving communities often use it interchangeably with digital preservation. Computing professionals tend to use digital archiving to mean the process of backup and ongoing maintenance as opposed to strategies for long-term digital preservation. It is this latter richer definition, as defined under digital preservation which has been used throughout this Handbook."
  - id: "digital-materials"
    term: "Digital Materials"
    definitions:
      - source: "dpc"
        text: "A broad term encompassing digital surrogates created as a result of converting analogue materials to digital form (digitisation), and \"born digital\" for which there has never been and is never intended to be an analogue equivalent, and digital records."
  - id: "digital-object"
    term: "Digital Object"
    definitions:
      - source: "fadgi"
        text: "A discrete unit of information in digital form. From Introduction and Supporting Materials from PREMIS Data Dictionary, p. 6. The associated footnote adds: \" . . . differs from the definition of digital object commonly used in the digital library community, which holds a digital object to be a combination of identifier, metadata, and data.\""
  - id: "digital-preservation"
    term: "Digital Preservation"
    definitions:
      - source: "dpc"
        text: "Refers to the series of managed activities necessary to ensure continued access to digital materials for as long as necessary. Digital preservation is defined very broadly for the purposes of this study and refers to all of the actions required to maintain access to digital materials beyond the limits of media failure or technological and organisational change. Those materials may be records created during the day-to-day business of an organisation; \"born-digital\" materials created for a specific purpose (e.g. teaching resources); or the products of digitisation projects. This Handbook specifically excludes the potential use of digital technology to preserve the original artefacts through digitisation.\n\n- Short-term preservation - Access to digital materials either for a defined period of time while use is predicted but which does not extend beyond the foreseeable future and/or until it becomes inaccessible because of changes in technology.\n\n- Medium-term preservation - Continued access to digital materials beyond changes in technology for a defined period of time but not indefinitely.\n\n- Long-term preservation - Continued access to digital materials, or at least to the information contained in them, indefinitely."
      - source: "saa"
        text: "The management and protection of digital information to ensure authenticity, integrity, reliability, and long-term accessibility\n\nDigital preservation represents the utilization of management activities, strategies, best practices and standards, and policies and procedures to guarantee ongoing access to digitized and born-digital information, despite the challenges of technological change, media deterioration, hardware/software obsolescence, human error, and intentional harm. Digital preservation efforts seek to provide accurate and authentic rendering of content, while ensuring its future functionality and usability over time."
        url: "https://dictionary.archivists.org/entry/digital-preservation.html"
  - id: "digitization"
    term: "Digitization"
    definitions:
      - source: "dpc"
        text: "The process of creating digital files by scanning or otherwise converting analogue materials. The resulting digital copy, or digital surrogate, would then be classed as digital material and then subject to the same broad challenges involved in preserving access to it, as \"born digital\" materials."
      - source: "saa"
        text: "To transform analog information into digital form.\n\nDigitization may transform information stored in analog physical formats (such as paper and parchment) or in analog but electronic formats (such as magnetic audiotape or phonograph discs). Records can be digitized via scanning or photography or via the conversion of analog audiovisual information into bits."
        url: "https://dictionary.archivists.org/entry/digitize.html"
      - source: "fadgi"
        text: "The process of recording an analog signal in a digital form. In relation to content of this site, it describes the process of translating analog signal data emanating from an object (light or sound) into a digitally encoded format. Audio, still and moving images are commonly digitized for increased access or for preservation purposes."
  - id: "disposition"
    term: "Disposition"
    definitions:
      - source: "saa"
        text: "Materials' final destruction or transfer to an archives as determined by their appraisal. Records may be transferred to archives in their entirety, or in part by sampling or selection."
        url: "https://dictionary.archivists.org/entry/disposition.html"
  - id: "documentation"
    term: "Documentation"
    definitions:
      - source: "dpc"
        text: "The information provided by a creator and the repository which provides enough information to establish provenance, history and context and to enable its use by others."
      - source: "saa"
        text: "1.  Materials created or collected to provide facts for reference, especially when created to substantiate decisions, actions, or events.\n\n2.  Citations, including footnotes, endnotes, bibliographies, and similar devices, that indicate an author's sources.\n\n3.  Computing: Instructions, specifications, and other descriptive information relating to the installation and use of hardware, software, systems, or files.\n\nDocumentation may be in any format, including text, photographs, moving images, or sound."
        url: "https://dictionary.archivists.org/entry/documentation.html"
  - id: "metadata"
    term: "Metadata"
    definitions:
      - source: "dpc"
        text: "Information which describes significant aspects of a resource. Most discussion to date has tended to emphasise metadata for the purposes of resource discovery. The emphasis in this Handbook is on what metadata are required successfully to manage and preserve digital materials over time and which will assist in ensuring essential contextual, historical, and technical information are preserved along with the digital object. The PREMIS Data Dictionary for Preservation Metadata has become a key de facto standard in digital preservation."
      - source: "saa"
        text: "Information about data that promotes discovery, structures data objects, and supports the administration and preservation of records.\n\nMetadata may be embedded or external. It may be applied at a variety of levels of granularity and during different periods in the life cycle of data. It is typically demarcated and standardized, and it often provides context."
        url: "https://dictionary.archivists.org/entry/metadata.html"
      - source: "fadgi"
        text: "Information about an analog or digital object, a component of an object, or a coherent collection of objects. Metadata describing digital content is often structured (e.g., with tagging or markup) and it may be embedded (Metadata, embedded) within a single file, incorporated within the \"packaging\" that is associated with a group of files (e.g., METS), placed in a related external file (e.g., XMP sidecar file), or in a system external to the digital file (e.g., a database) to which the digital file or files are linked via a unique key or association."
  - id: "migration"
    term: "Migration"
    definitions:
      - source: "dpc"
        text: "A means of overcoming technological obsolescence by transferring digital resources from one hardware/software generation to the next. The purpose of migration is to preserve the intellectual content of digital objects and to retain the ability for clients to retrieve, display, and otherwise use them in the face of constantly changing technology. Migration differs from the refreshing of storage media in that it is not always possible to make an exact digital copy or replicate original features and appearance and still maintain the compatibility of the resource with the new generation of technology."
      - source: "saa"
        text: "A digital preservation strategy that includes moving data from one information system or storage medium to another. Copying information onto the same format storage media without any alteration is generally referred to as refreshing."
        url: "https://dictionary.archivists.org/entry/migration.html"
  - id: "premis"
    term: "PREMIS"
    definitions:
      - source: "dpc"
        text: "Preservation Metadata: Implementation Strategies. A de facto standard for digital preservation metadata. [http://www.loc.gov/standards/premis/](http://www.loc.gov/standards/premis/)"
      - source: "fadgi"
        text: "Term strongly associated with the Preservation Metadata for Digital Materials (PREMIS) working group. The group defined a core preservation metadata set, supported by a data dictionary, and identified strategies for encoding, storing, and managing this metadata. Many data elements that are important for preservation are found in other categories, especially those classified as administrative."
      - source: "saa"
        text: "Abbr. of Preservation Metadata: Implementation Strategies"
        url: "https://dictionary.archivists.org/entry/premis.html"
  - id: "reappraisal"
    term: "Reappraisal"
    definitions:
      - source: "saa"
        text: "The process of identifying materials that no longer merit inclusion in an archives and that are candidates for deaccessioning.\n\nA repository may reappraise holdings because the original appraisal was faulty, the repository’s collecting policy has changed, or the perceived value of the material has changed over time."
        url: "https://dictionary.archivists.org/entry/reappraisal.html"
  - id: "retention-schedule"
    term: "Retention Schedule"
    definitions:
      - source: "saa"
        text: "A document that identifies and describes an organization’s records, usually at the series level, and provides instructions for the disposition of records throughout their life cycle.\n\nRetention schedules may include instructions for the disposition of documents and other materials that are not official records. A retention schedule is synonymous with a disposal schedule, records retention schedule, records schedule, or transfer schedule. The term records schedule can refer to both the entire document and to the individual entries within the document."
        url: "https://dictionary.archivists.org/entry/retention-schedule.html"
