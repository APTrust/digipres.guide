  - id: "starting-out"
    title: "Not sure where to start"
    description: "No digital preservation work yet, and you want to begin"
    status: "Ready for review"
    effort: ""
    steps:
      - n: 1
        title: "Learn the basics"
        blurb: "Digital preservation is a strategy, not a product you buy. Start with the LEARN section."
