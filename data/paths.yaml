        tools: []
        varies: false
      - n: 2
        title: "Find your community"
        blurb: "Join the NDSA (it's free) or a regional group. Others have already solved the problems you're facing."
        section: "learn/community"
        tools: []
        varies: false
      - n: 3
        title: "Take stock of what you have"
