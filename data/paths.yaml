        varies: false
framing:
  home-intro: "Take the next step, whatever that looks like. Tell us a little about your situation and we'll point you to the parts of the toolkit that matter most right now."
  situation-question: "What are you working with?"
  level-question: "What can you put toward it?"
  one-route: "This is one good route for your situation, not the only one. Skip steps you've already done; the full toolkit is always one click away."
  level-change: "Your answers aren't permanent. As your resources grow, come back and pick a new level."
  good-enough: "Good is good enough for now. Start with what you have, then take the next step."
