<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body{{ if in site.Params.phases .Section }} class="phase-{{ .Section }}"{{ end }}{{ with site.GetPage "/checklists" }} data-worksheet="{{ .RelPermalink }}"{{ end }}>
  <a class="skip-link" href="#main">Skip to main content</a>
  {{ partial "header.html" . }}
  <main id="main" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
